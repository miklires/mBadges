name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build :api:build --no-daemon
      - name: Verify and update Modrinth project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          project="$(curl --fail-with-body --silent \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID")"
          echo "$project" | jq -e '.title == "mBadges" or .slug == "mbadges"' >/dev/null
          jq -n --rawfile body README.md '{
            title: "mBadges",
            description: "Graphical player badges with collections, ordered equipment slots, and generated resource packs.",
            body: $body,
            source_url: "https://github.com/miklires/mBadges",
            issues_url: "https://github.com/miklires/mBadges/issues",
            license_id: "MIT",
            requested_status: "approved"
          }' > modrinth-project.json
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @modrinth-project.json \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID"
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: image/png" \
            --data-binary @docs/assets/mbadges-icon.png \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/icon?ext=png"
      - run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      - run: gh release upload v1.0.1 build/libs/mBadges-1.0.1.jar api/build/libs/mBadges-API-1.0.1.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
